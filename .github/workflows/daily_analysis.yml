name: Daily Job Data & Analysis

on:
  schedule:
    - cron: "0 17 * * *"  # JST 02:00 実行（UTC換算）
  workflow_dispatch:

jobs:
  daily-run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo  

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r analysis/requirements.txt

      # 1. スクレイピング（新着求人収集）
      - name: Run job scraping
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}  #
        run: |
          python analysis/scrape_jobs_pg.py

      # 2. 求人数予測（Prophet）
      - name: Run Prophet trend forecast
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python analysis/trend_forecast.py

      #  3. スキルトレンド分析（LinearRegression）
      - name: Run skill trend analysis
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python analysis/trend_score.py

      #  4. データ更新完了
      - name: Run Data Complete
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python analysis/data_complete.py
